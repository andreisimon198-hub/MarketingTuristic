<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketing Turistic — Grilă Examen</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #1c2333;
    --border: #30363d;
    --gold: #e6b84a;
    --gold-dim: #7a5c1a;
    --green: #3fb950;
    --green-bg: rgba(63,185,80,0.12);
    --red: #f85149;
    --red-bg: rgba(248,81,73,0.12);
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(230,184,74,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -200px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(88,166,255,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 760px;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 0.6rem;
    font-weight: 500;
  }

  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 900;
    color: var(--text);
    line-height: 1.15;
  }

  header h1 span { color: var(--gold); }

  .stats-bar {
    display: flex;
    justify-content: center;
    gap: 2rem;
    margin-top: 1.2rem;
    flex-wrap: wrap;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.2rem;
  }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
  }

  .progress-bar-wrap {
    width: 100%;
    height: 3px;
    background: var(--border);
    border-radius: 99px;
    margin: 2rem 0 1.5rem;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold-dim), var(--gold));
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem 2rem 1.6rem;
    margin-bottom: 1rem;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  .q-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2rem;
  }

  .q-number {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--gold);
    font-weight: 500;
  }

  .q-badge {
    font-size: 0.65rem;
    padding: 0.25rem 0.6rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 99px;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  .question-text {
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--text);
    font-weight: 400;
    margin-bottom: 1.6rem;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .option-btn {
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 0.85rem 1.1rem;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    line-height: 1.5;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
    display: flex;
    align-items: flex-start;
    gap: 0.7rem;
  }

  .option-btn:hover:not(:disabled) {
    border-color: var(--gold-dim);
    background: rgba(230,184,74,0.06);
    transform: translateX(3px);
  }

  .option-btn:disabled { cursor: default; }

  .option-letter {
    min-width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--border);
    font-size: 0.7rem;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    flex-shrink: 0;
    margin-top: 1px;
    transition: background 0.15s, color 0.15s;
  }

  .option-btn.correct {
    border-color: var(--green);
    background: var(--green-bg);
  }

  .option-btn.correct .option-letter {
    background: var(--green);
    color: #fff;
  }

  .option-btn.wrong {
    border-color: var(--red);
    background: var(--red-bg);
  }

  .option-btn.wrong .option-letter {
    background: var(--red);
    color: #fff;
  }

  .feedback {
    margin-top: 1.2rem;
    padding: 0.85rem 1rem;
    border-radius: 10px;
    font-size: 0.88rem;
    line-height: 1.5;
    display: none;
    animation: fadeIn 0.25s ease;
  }

  .feedback.show { display: block; }

  .feedback.success {
    background: var(--green-bg);
    border: 1px solid var(--green);
    color: var(--green);
  }

  .feedback.error {
    background: var(--red-bg);
    border: 1px solid var(--red);
    color: var(--red);
  }

  .feedback strong { font-weight: 600; }

  .btn-next {
    margin-top: 1.4rem;
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, #b8892a, var(--gold));
    border: none;
    border-radius: 10px;
    color: #0d1117;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    display: none;
  }

  .btn-next:hover { opacity: 0.9; transform: translateY(-1px); }
  .btn-next.show { display: block; }

  .result-screen {
    text-align: center;
    padding: 3rem 2rem;
    display: none;
  }

  .result-screen.show { display: block; }
  .quiz-area.hidden { display: none; }

  .result-icon {
    font-size: 4rem;
    margin-bottom: 1rem;
  }

  .result-screen h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    color: var(--gold);
    margin-bottom: 0.5rem;
  }

  .result-screen p {
    color: var(--muted);
    margin-bottom: 2rem;
    font-size: 1rem;
  }

  .result-score {
    font-family: 'Playfair Display', serif;
    font-size: 3.5rem;
    font-weight: 900;
    color: var(--text);
    margin-bottom: 0.3rem;
  }

  .btn-restart {
    padding: 0.9rem 2.5rem;
    background: linear-gradient(135deg, #b8892a, var(--gold));
    border: none;
    border-radius: 10px;
    color: #0d1117;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 1rem;
  }

  .btn-restart:hover { opacity: 0.88; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card { animation: fadeIn 0.3s ease; }

  footer {
    margin-top: 2.5rem;
    text-align: center;
    font-size: 0.7rem;
    color: var(--muted);
    letter-spacing: 0.08em;
  }
</style>
</head>

</div>

const LETTERS = ['A', 'B', 'C', 'D'];

let queue = [];
let answered = 0;
let correct = 0;
let wrong = 0;
let current = null;
let answered_this = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function initQueue() {
  queue = shuffle(ALL_QUESTIONS.map((q, i) => i));
}

function updateStats() {
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('stat-total').textContent = answered;
  const pct = Math.round((answered / ALL_QUESTIONS.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

function loadQuestion() {
  if (queue.length === 0) {
    showResult();
    return;
  }
  const idx = queue.shift();
  current = { ...ALL_QUESTIONS[idx], idx };
  answered_this = false;

  document.getElementById('q-number').textContent = `Întrebarea ${answered + 1} din ${ALL_QUESTIONS.length}`;
  document.getElementById('q-badge').textContent = `${queue.length + 1} rămase`;
  document.getElementById('question-text').textContent = current.q;

  const list = document.getElementById('options-list');
  list.innerHTML = '';
  current.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.onclick = () => selectAnswer(i);
    btn.innerHTML = `<span class="option-letter">${LETTERS[i]}</span><span>${opt}</span>`;
    list.appendChild(btn);
  });

  const fb = document.getElementById('feedback');
  fb.className = 'feedback';
  fb.innerHTML = '';

  document.getElementById('btn-next').classList.remove('show');
}

function selectAnswer(chosen) {
  if (answered_this) return;
  answered_this = true;
  answered++;

  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => b.disabled = true);

  const isCorrect = chosen === current.correct;

  if (isCorrect) {
    correct++;
    buttons[chosen].classList.add('correct');
    showFeedback(true, null);
  } else {
    wrong++;
    buttons[chosen].classList.add('wrong');
    buttons[current.correct].classList.add('correct');
    showFeedback(false, current.opts[current.correct], LETTERS[current.correct]);
  }

  updateStats();
  document.getElementById('btn-next').classList.add('show');
}

function showFeedback(ok, correctOpt, letter) {
  const fb = document.getElementById('feedback');
  if (ok) {
    fb.className = 'feedback success show';
    fb.innerHTML = '✓ <strong>Corect!</strong> Bravo, răspuns excelent.';
  } else {
    fb.className = 'feedback error show';
    fb.innerHTML = `✗ <strong>Greșit.</strong> Răspunsul corect era: <strong>${letter}. ${correctOpt}</strong>`;
  }
}

function nextQuestion() {
  loadQuestion();
}

function showResult() {
  document.getElementById('quiz-area').classList.add('hidden');
  const rs = document.getElementById('result-screen');
  rs.classList.add('show');
  const pct = Math.round((correct / ALL_QUESTIONS.length) * 100);
  document.getElementById('result-score').textContent = `${correct} / ${ALL_QUESTIONS.length}`;
  let msg = '';
  if (pct >= 85) msg = `Excelent! Scor ${pct}% — ești pregătit pentru examen! 🎓`;
  else if (pct >= 60) msg = `Bine! Scor ${pct}% — mai exersează puțin și vei fi gata.`;
  else msg = `Scor ${pct}% — continuă să exersezi, vei reuși!`;
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('progress-fill').style.width = '100%';
}

function restartQuiz() {
  correct = 0; wrong = 0; answered = 0;
  updateStats();
  document.getElementById('progress-fill').style.width = '0%';
  document.getElementById('result-screen').classList.remove('show');
  document.getElementById('quiz-area').classList.remove('hidden');
  initQueue();
  loadQuestion();
}

initQueue();
loadQuestion();
updateStats();
